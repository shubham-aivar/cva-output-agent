# PLACEHOLDER PRICE CATALOG: NOT the AWS Price List.
# Linux on-demand hourly prices are Aivar engineering estimates for us-east-1 (from memory) and
# must be replaced by an AWS Price List snapshot before any customer-facing use.
# Where "windows_hr" is present it was OBSERVED in Cloudamize's public sample export
# (Compute sheet, Annual Total Cost / 8760, Windows, on-demand, us-east-1).
# SQL Server license-included add-ons are Aivar estimates from memory.  Reserved-instance and
# dedicated-host multipliers are generic planning ratios, not quotes.

[meta]
source = "PLACEHOLDER (Aivar estimates + Cloudamize public sample observations)"
version = "0.1-placeholder"
region = "us-east-1"
placeholder = true

[license]
windows_per_vcpu_hr = 0.046            # non-burstable instances; matches observed m7i/r7i/r7a rows
windows_per_vcpu_hr_burstable = 0.0184 # fallback for t-family sizes without an observed price
sql_standard_per_vcpu_hr = 0.1065
sql_enterprise_per_vcpu_hr = 0.349
sql_web_per_vcpu_hr = 0.0
sql_developer_per_vcpu_hr = 0.0
sql_express_per_vcpu_hr = 0.0

[multipliers]
ri_1yr_infra = 0.62                    # applied to the infrastructure part only; license part is not discounted
ri_3yr_infra = 0.40
dedicated_host_infra = 1.30            # surcharge on infrastructure when a BYOL finding requires dedicated tenancy

[storage]
gp3_gb_month = 0.08

