# Cloudamize "OLA Accelerator Export" (AWS OLA template).  Verified against Cloudamize's public sample
# (OLA-Accelerator-Export.xlsx, 4 sheets).  Headers are matched after normalisation (case, punctuation).
[sheets]
main = ["Export Template"]
io = ["IO Throughput"]
storage = ["Storage Details"]

[main]
name = ["On-Prem Server Name"]
sql_instance = ["On-Prem Database Instance Name"]
cluster = ["On-Prem VMWare Hyper-V Cluster"]
host = ["On-Prem Hypervisor Host"]
host_cores = ["On-Prem Hypervisor Total Physical Cores"]
sql_edition = ["On-Prem SQL Server Edition"]
sql_version = ["On-Prem SQL Server Version"]
os = ["On-Prem Operating System"]
vcpu = ["On-Prem Total Physical Cores -OR- Virtual Cores"]
cpu_avg = ["On-Prem CPU AVG Util%"]
cpu_peak = ["On-Prem CPU Peak Util%"]
ram_gb = ["On-Prem RAM (GB)"]
ram_avg = ["On-Prem RAM AVG Util%"]
ram_peak = ["On-Prem RAM Peak Util%"]
storage_used_gb = ["On-Prem Utilized Storage (GiB)"]
source_instance = ["EC2 Instance"]
machine_type = ["Machine Type"]
env = ["Environment"]
region = ["AWS Region For Pricing"]
# licensing decision columns of the AWS OLA template (filled by a person in "Step 2")
lic_by = ["License SQL By Cores or Server/CAL"]
active_sa = ["Active SQL SA?"]
lic_model = ["AWS SQL Licensing Model"]
lic_override = ["--Override -- Inc / Excl Entire Server From SQL License Count"]
id = ["ID"]
required = ["name", "os", "vcpu", "ram_gb"]

[io]
name = ["Server Name"]
net = ["Network IO MBps"]
disk = ["Disk IO MBps"]
iops = ["Agg Disk IOPS"]
id = ["ID"]
required = ["name"]

[storage]
name = ["Instance Name"]
capacity = ["Current Disk Capacity (GB)"]
used = ["Disk Occupancy (GB)"]
required = ["name"]
