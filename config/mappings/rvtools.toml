# RVTools "Export all to Excel" (also a ZIP of CSVs).  Verified against the sample
# rvtools_sample_export_2.xlsx (vInfo, vCPU, vMemory, vDisk, vPartition, vNetwork, vHost, vCluster,
# vDatastore, vHealth, vSource).
[sheets]
info = ["vInfo"]
cpu = ["vCPU"]
mem = ["vMemory"]
health = ["vHealth"]
host = ["vHost"]

[info]
name = ["VM"]
power = ["Powerstate"]
template = ["Template"]
vcpu = ["CPUs"]
ram_mib = ["Memory"]
prov_mib = ["Provisioned MiB"]
used_mib = ["In Use MiB"]
annotation = ["Annotation"]
cluster = ["Cluster"]
host = ["Host"]
os_cfg = ["OS according to the configuration file"]
os_tools = ["OS according to the VMware Tools"]
created = ["Creation date"]
uuid = ["VM UUID"]
required = ["name", "vcpu", "ram_mib"]

[cpu]
name = ["VM"]
max_mhz = ["Max"]
overall_mhz = ["Overall"]
required = ["name"]

[mem]
name = ["VM"]
size_mib = ["Size MiB"]
active_mib = ["Active"]
consumed_mib = ["Consumed"]
required = ["name"]

[health]
name = ["Name"]
message = ["Message"]
mtype = ["Message type"]
required = ["name"]

[host]
name = ["Host"]
cores = ["# Cores"]
required = ["name"]
