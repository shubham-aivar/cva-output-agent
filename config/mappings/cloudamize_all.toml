# Cloudamize "Download All Reports -> Detailed" workbook.  Verified against Cloudamize's public sample
# (MigrationPlanner-Download-All-Reports-Report.xlsx, 16 sheets, 308 servers).
[sheets]
compute = ["Compute"]
license = ["License"]
machine = ["Machine Details"]
infra = ["Infrastructure Summary"]
storage = ["Storage"]

[compute]
name = ["Server Name"]
ip = ["IP Address"]
os = ["OS"]
os_version = ["OS Version"]
source_instance = ["Recommended Instance"]
tenancy = ["Tenancy"]
constraint = ["Constraint"]
sql_edition = ["MS SQL Edition"]
sql_version = ["SQL Version"]
on_time = ["On Time (%)"]
vcpu = ["Observed vCPU"]
rec_vcpu = ["Recommended vCPU"]
cpu_current = ["Current CPU Utilization (%)"]
cpu_pred = ["Predicted CPU Utilization (%)"]
ram_gb = ["Observed Memory Provisioned (GB)"]
ram_peak_gb = ["Peak Memory Used (GB)"]
rec_mem = ["Recommended Memory (GB)"]
annual_cost = ["Annual Total Cost ($)"]
region = ["Region"]
plan = ["Pricing Plan"]
asset = ["Asset"]
id = ["ID (server name + uid)"]
required = ["name", "os", "vcpu", "ram_gb"]

[license]
name = ["Server Name"]
reason = ["License Cost Reason"]
plan = ["Pricing Plan"]
license_cost = ["License Cost ($)"]
required = ["name"]

[machine]
name = ["Machine Name"]
os_details = ["OS Details"]
runs_sql = ["Is Running MS SQL"]
eol = ["OS is End of Life"]
mem_alloc = ["Memory Allocated GB"]
required = ["name"]

[infra]
name = ["Server Name"]
span = ["Collection Time Span"]
data_source = ["Data Source"]
required = ["name"]

[storage]
name = ["Server Name"]
capacity = ["Observed Disk Capacity (GB)"]
used = ["Observed Disk Occupancy (GB)"]
required = ["name"]
