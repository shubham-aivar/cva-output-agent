<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVA Output Processing Agent</title>
<style>
:root{
  --paper:#f4f6f9; --card:#ffffff; --ink:#14213d; --muted:#5b6578; --rule:#d9dee7; --rule2:#eceff4;
  --teal:#0b7a75; --teal-w:#e2f1f0; --amber:#a24c07; --amber-w:#fdf0d8; --red:#b42318; --red-w:#fde7e4; --slate:#3b4a63;
  --font: Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.5;display:grid;grid-template-columns:250px minmax(0,1fr)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* rail */
#rail{background:var(--ink);color:#dfe6f3;padding:20px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
#rail h1{font-size:15px;margin:0;font-weight:650;color:#fff;line-height:1.3}
#rail small{color:#9fb0cc}
#rail .who{display:flex;flex-direction:column;gap:4px}
#rail input{background:#1d2d52;border:1px solid #31456f;border-radius:6px;padding:7px 9px;color:#fff;width:100%}
#rail nav{display:flex;flex-direction:column;gap:2px}
#rail nav button{background:none;border:0;text-align:left;color:#cfd9ec;padding:8px 10px;border-radius:6px}
#rail nav button[aria-current=true]{background:#24376a;color:#fff}
#rail nav button:hover{background:#1d2d52}
#rail .runs{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow:auto}
#rail .runs button{background:none;border:1px solid transparent;text-align:left;color:#cfd9ec;padding:6px 9px;border-radius:6px;font-size:13px}
#rail .runs button[aria-current=true]{border-color:#4a6199;background:#1d2d52;color:#fff}
.btn-new{background:var(--teal);border:0;color:#fff;border-radius:6px;padding:8px 10px;font-weight:600}
/* main */
main{min-width:0}
#strip{position:sticky;top:0;z-index:5;background:rgba(244,246,249,.96);backdrop-filter:blur(4px);border-bottom:1px solid var(--rule);padding:10px 28px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#strip .title{font-weight:650}
#strip .meta{color:var(--muted);font-size:13px}
.gatepill{border-radius:999px;padding:4px 12px;font-weight:650;font-size:13px}
.gatepill.open{background:var(--amber-w);color:var(--amber)}
.gatepill.clear{background:var(--teal-w);color:var(--teal)}
.gatepill.final{background:var(--teal);color:#fff}
#view{padding:24px 28px 80px;max-width:1180px}
h2{font-size:22px;margin:0 0 4px;font-weight:650}
h3{font-size:16px;margin:26px 0 8px;font-weight:650}
.lede{color:var(--muted);margin:0 0 18px;max-width:78ch}
.say{font-size:18px;line-height:1.55;max-width:70ch;margin:14px 0 4px}
.src{font-size:12px;color:var(--muted)}
.chip{display:inline-block;border-radius:5px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--rule2);color:var(--slate);margin-right:4px;white-space:nowrap}
.chip.teal{background:var(--teal-w);color:var(--teal)} .chip.amber{background:var(--amber-w);color:var(--amber)} .chip.red{background:var(--red-w);color:var(--red)}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
th{background:#eef1f7;text-align:left;font-weight:650;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--rule);color:var(--slate)}
td{padding:7px 10px;border-bottom:1px solid var(--rule2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:#f6f9fc}
.right{text-align:right}
button.fig{background:none;border:0;border-bottom:1.5px dotted var(--teal);padding:0 1px;color:inherit;font-weight:inherit;font-variant-numeric:tabular-nums}
button.fig:hover{background:var(--teal-w)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-weight:600}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--rule)}
.btn.good{background:var(--teal)} .btn.bad{background:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;margin:8px 0}
.field input,.field select,.field textarea{border:1px solid var(--rule);border-radius:6px;padding:7px 9px;background:#fff;min-width:200px}
.field textarea{min-height:64px;width:100%}
textarea{display:block;width:100%;min-height:76px;border:1px solid var(--rule);border-radius:6px;padding:8px 10px;background:#fff;margin:6px 0}
select{border:1px solid var(--rule);border-radius:6px;padding:7px 9px;background:#fff}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
.notice{border-radius:8px;padding:10px 14px;margin:10px 0}
.notice.amber{background:var(--amber-w);color:#6b3305} .notice.red{background:var(--red-w);color:#7a1a12} .notice.teal{background:var(--teal-w);color:#0a5a56}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 36px}
dl.facts{margin:0;display:grid;grid-template-columns:minmax(200px,280px) 1fr;column-gap:24px}
dl.facts dt,dl.facts dd{margin:0;padding:7px 0;border-bottom:1px solid var(--rule)}
dl.facts dd{text-align:left;font-variant-numeric:tabular-nums;font-weight:600}
.chat{display:flex;flex-direction:column;gap:8px;margin:8px 0 14px;max-width:760px}
.turn{border-radius:10px;padding:8px 12px;max-width:88%;line-height:1.4}
.turn .who{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.turn .msg{white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.turn.svc{background:var(--card);border:1px solid var(--rule);align-self:flex-start}
.turn.a01{background:var(--rule2);align-self:flex-start}
.turn.me{background:var(--teal-w);color:#0a5a56;align-self:flex-end}
/* scenario bars */
.bars{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.bar{display:grid;grid-template-columns:110px 1fr 150px;gap:14px;align-items:center}
.bar .track{height:30px;background:var(--rule2);border-radius:4px;position:relative;overflow:hidden}
.bar .fill{height:100%;background:var(--teal);border-radius:4px}
.bar .fill.partial{background:repeating-linear-gradient(135deg,var(--teal),var(--teal) 8px,#2f9892 8px,#2f9892 16px)}
.bar .fill.nc{background:repeating-linear-gradient(135deg,#d6dbe5,#d6dbe5 7px,#eef1f6 7px,#eef1f6 14px);width:100%}
.bar .lbl{font-weight:600}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.mini{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin:6px 0}
.mini .t{height:10px;background:var(--rule2);border-radius:3px}.mini .t i{display:block;height:100%;background:var(--teal);border-radius:3px}
/* drawer */
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(460px,92vw);background:#fff;border-left:1px solid var(--rule);box-shadow:-8px 0 24px rgba(20,33,61,.12);transform:translateX(102%);transition:transform .18s ease;z-index:20;overflow:auto;padding:20px}
#drawer.open{transform:none}
#drawer h4{margin:0 0 4px;font-size:16px}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
dialog{border:1px solid var(--rule);border-radius:10px;padding:20px;max-width:720px;width:92vw}
dialog::backdrop{background:rgba(20,33,61,.4)}
pre{white-space:pre-wrap;word-break:break-word;background:#f0f3f8;border-radius:6px;padding:8px;font-size:12px;margin:4px 0}
details summary{cursor:pointer;color:var(--slate)}
.msg{border-left:3px solid var(--rule);padding:2px 10px;margin:8px 0}.msg.assistant{border-color:var(--teal)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:50;max-width:80vw}
.toast.err{background:var(--red)}
@media (max-width:900px){body{grid-template-columns:1fr}#rail{position:static;height:auto}.bar{grid-template-columns:90px 1fr 110px}}
</style>
</head>
<body>
<aside id="rail">
  <div><h1>CVA Output Processing Agent</h1><small>A01 &middot; Project Elevate</small></div>
  <div class="who"><label for="who"><small>Reviewer name (recorded on every decision)</small></label>
    <input id="who" placeholder="Your name" autocomplete="name"></div>
  <button class="btn-new" id="newrun">New run&hellip;</button>
  <div><small>Runs</small><div class="runs" id="runs"></div></div>
  <nav id="nav" aria-label="Sections"></nav>
  <form id="signout" method="post" action="/logout" hidden><small id="whoami"></small> <button type="submit" class="btn-new">Sign out</button></form>
</aside>
<main>
  <div id="strip"></div>
  <div id="view" tabindex="-1"></div>
</main>
<aside id="drawer" aria-label="Details" aria-hidden="true"></aside>
<dialog id="dlg"></dialog>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 401) { location.href = "/login"; throw new Error("sign in required"); }
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, err) { const t = el("div", { class: "toast" + (err ? " err" : ""), role: "status" }, msg); document.body.append(t); setTimeout(() => t.remove(), err ? 7000 : 3200); }
const money = v => v == null ? "not computable" : "$" + Math.round(v).toLocaleString("en-US");
const num = (v, d = 0) => v == null ? "n/a" : Number(v).toLocaleString("en-US", { maximumFractionDigits: d });
const VIEWS = [["overview", "Overview"], ["transform", "AWS Transform"], ["workloads", "Workloads"], ["licensing", "Licensing"], ["exceptions", "Exceptions"], ["agent", "Agent"], ["review", "Review and release"], ["outputs", "Outputs"], ["audit", "Audit"]];
const S = { run: null, view: "overview", ov: null, figs: null, app: { demo_samples: false }, runs: [] };
const who = () => $("#who").value.trim();
function needWho() { if (!who()) { toast("Enter your name in the left rail first; every decision is recorded against it.", true); $("#who").focus(); return false; } return true; }
async function act(fn, ok) { try { const r = await fn(); if (ok) toast(ok); await refresh(); return r; } catch (e) { toast(e.message, true); } }

// ------------------------------------------------------------------ figure receipts
async function figures() { if (!S.figs) { const l = await api(`/api/run/${S.run}/figures`); S.figs = Object.fromEntries(l.map(f => [f.key, f])); } return S.figs; }
function fig(key, fmt) {
  const f = S.ov && S.ov.figures ? S.ov.figures[key] : undefined;
  const txt = fmt ? fmt(f) : (typeof f === "number" ? num(f, Number.isInteger(f) ? 0 : 1) : (f == null ? "n/a" : String(f)));
  return el("button", { class: "fig", type: "button", title: "Where does this number come from?", onclick: () => showFigure(key) }, txt);
}
async function showFigure(key) {
  const f = (await figures())[key]; const d = $("#drawer");
  d.replaceChildren(
    el("button", { class: "btn alt", onclick: closeDrawer }, "Close"),
    el("h4", { style: "margin-top:14px" }, f ? f.label : key),
    el("p", { class: "lede" }, "Every number has a receipt: the rule that produced it, the version of that rule, its inputs and the files it came from."),
    f ? el("dl", { class: "facts" },
      el("dt", {}, "Figure"), el("dd", {}, f.id), el("dt", {}, "Value"), el("dd", {}, f.unit === "USD/yr" ? money(f.value) : String(f.value) + " " + f.unit),
      el("dt", {}, "Rule"), el("dd", {}, f.rule + " @ version " + f.rule_version)) : el("p", {}, "No such figure."),
    f ? el("h3", {}, "Inputs") : null, f ? el("pre", {}, JSON.stringify(f.inputs, null, 2)) : null,
    f && f.refs.length ? el("p", { class: "src" }, "Source files: " + f.refs.join(", ")) : null,
    el("p", { class: "src" }, "The same figure, with its workload-level detail, is on the Ledger and Workloads sheets of the supporting workbook."));
  openDrawer();
}
function openDrawer() { const d = $("#drawer"); d.classList.add("open"); d.setAttribute("aria-hidden", "false"); }
function closeDrawer() { const d = $("#drawer"); d.classList.remove("open"); d.setAttribute("aria-hidden", "true"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

// ------------------------------------------------------------------ shell
async function loadRuns(select) {
  const { runs, portfolio } = await api("/api/runs");
  S.portfolio = portfolio; S.runs = runs;
  const box = $("#runs"); box.replaceChildren();
  runs.slice().reverse().forEach(r => box.append(el("button", { "aria-current": r.run_id === S.run, onclick: () => selectRun(r.run_id) },
    r.run_id + (r.finalised ? " (final)" : ""), el("br"), el("small", {}, r.label || r.files[0]))));
  if (!runs.length) box.append(el("small", {}, "No runs yet."));
  if (select && runs.length && !S.run) await selectRun(runs[runs.length - 1].run_id);
  else if (!runs.length) render();
}
async function selectRun(id) { S.run = id; S.figs = null; location.hash = id + "/" + S.view; await refresh(); await loadRuns(false); }
async function refresh() { if (!S.run) return render(); S.figs = null; try { S.ov = await api(`/api/run/${S.run}/overview`); } catch (e) { toast(e.message, true); } render(); }
function nav() {
  const n = $("#nav"); n.replaceChildren();
  VIEWS.forEach(([k, t]) => n.append(el("button", { "aria-current": k === S.view, onclick: () => { S.view = k; location.hash = S.run + "/" + k; render(); } }, t)));
}
function strip() {
  const s = $("#strip"); s.replaceChildren();
  if (!S.ov) { s.append(el("span", { class: "title" }, "No run selected")); return; }
  const g = S.ov.gate, fin = S.ov.finalised;
  s.append(el("div", {}, el("span", { class: "title" }, S.run + (S.ov.manifest.label ? "  " + S.ov.manifest.label : "")),
    el("div", { class: "meta" }, S.ov.estate.files.join(", "), "  |  ", S.ov.estate.workloads + " workloads  |  data grade " + S.ov.meta.richness.grade)),
    el("span", { class: "gatepill " + (fin ? "final" : g.ready ? "clear" : "open") }, fin ? "FINAL: released" : g.ready ? "Review gate clear: ready to finalise" : "DRAFT: " + g.open + " review item(s) open"));
}
function render() {
  clearInterval(S.poll); nav(); strip(); const v = $("#view"); v.replaceChildren();
  if (!S.run || !S.ov) { v.append(emptyState()); return; }
  ({ overview, transform: awsView, workloads, licensing, exceptions, agent, review, outputs, audit }[S.view] || overview)(v);
}
function emptyState() {
  return el("div", {}, el("h2", {}, S.runs.length ? "Open a run, or upload new files" : "No runs yet"),
    el("p", { class: "lede" }, "Nothing is shown until you upload your own files. Start with the estate export from Cloudamize (MPA export, OLA Accelerator export or Download All Reports) or an RVTools file; add a licensing sheet and interview notes if you have them. Every figure on the other tabs is computed from what you upload."),
    el("button", { class: "btn good", onclick: newRun }, "Upload files and create a run\u2026"),
    S.runs.length ? el("p", { class: "src" }, "Earlier runs on this machine are listed on the left; open one to continue it.") : null,
    S.app.demo_samples ? el("p", { class: "notice amber" }, "DEMO MODE is on: bundled sample files are offered in the upload dialog. Start the UI without --demo-samples for your own files only.") : null);
}

// ------------------------------------------------------------------ overview
function overview(v) {
  const o = S.ov, f = o.figures, rich = o.meta.richness;
  v.append(el("h2", {}, "Overview"), el("p", { class: "lede" }, S.ov.scenarios.length ? "Cost per scenario for the same estate, and how far each can be trusted." : "What A01 found in the file. The cost figures come from AWS Transform."));
  const c = o.commentary.executive_summary;
  v.append(el("p", { class: "say" }, c.text), el("div", { class: "src" }, "Commentary source: " + c.source + ". "), );
  if (o.meta.figures_source === "aws_transform") v.append(el("div", { class: "notice teal" }, "Figures come from the imported AWS Transform assessment \u201c" + (o.aws ? o.aws.scenario : "") + "\u201d. A01's own estimate is a cross-check only."));
  else if (o.meta.figures_source === "a01_estimate") v.append(el("div", { class: "notice amber" }, "Figures are A01's own OFFLINE estimate on a PLACEHOLDER price catalog, not the AWS Price List. Import an AWS Transform assessment (Outputs) for AWS's numbers."));
  if (!o.scenarios.length) v.append(noFigures(o));
  const max = Math.max(...o.scenarios.map(s => s.total || 0), 1);
  const bars = el("div", { class: "bars", role: "list" });
  const keyOf = { on_demand: "scenario.on_demand.total", ri_1yr: "scenario.ri_1yr.total", ri_3yr: "scenario.ri_3yr.total", byol: "scenario.byol.total" };
  o.scenarios.forEach(s => bars.append(el("div", { class: "bar", role: "listitem" },
    el("div", { class: "lbl" }, s.label),
    el("div", { class: "track" }, el("div", { class: "fill " + (s.status === "not_computable" || s.status === "not_in_assessment" ? "nc" : s.status === "computed" ? "" : "partial"), style: s.total != null ? `width:${Math.max(3, 100 * s.total / max)}%` : "" })),
    el("div", { class: "val" }, s.total == null ? el("span", { class: "chip amber" }, s.status.replace(/_/g, " ")) : fig(keyOf[s.id], x => money(x)), el("div", { class: "src" }, (s.status !== "computed" && s.total != null ? s.status + " | " : "") + (s.source === "aws_transform" ? "AWS Transform" : "A01 estimate"))))));
  v.append(bars);
  const notes = o.scenarios.flatMap(s => s.notes.map(n => s.label + ": " + n));
  notes.forEach(n => v.append(el("div", { class: "src" }, n)));
  const col = (title, ...rows) => el("div", {}, el("h3", {}, title), el("dl", { class: "facts" }, rows.flat()));
  const kv = (k, val) => [el("dt", {}, k), el("dd", {}, val)];
  const lc = o.licensing, kp = o.kpis;
  v.append(el("div", { class: "cols" },
    !o.sizing_source ? null : col(o.sizing_source === "aws_transform" ? "Rightsizing (AWS Transform)" : "Rightsizing (A01 estimate)", kv("Over-provisioned", fig("sizing.downsize")), kv("Close to right", fig("sizing.same")), kv("Need more capacity", fig("sizing.upsize")),
      kv("Recommended vCPU", fig("sizing.vcpu_rec")), kv("Low-confidence sizings", fig("sizing.conf_low"))),
    col("Licensing", kv("Input", lc.mode), kv("SQL Server coverage", fig("licensing.coverage_sql", x => x == null ? "not detected" : num(x, 1) + "%")),
      kv("Windows Server coverage", fig("licensing.coverage_windows", x => num(x, 1) + "%")), kv("Items without a finding", fig("licensing.gaps"))),
    col("Risk and lifecycle", kv("Past end of support", fig("lifecycle.eos")), kv("Approaching", fig("lifecycle.approaching")), kv("Workloads at risk", fig("lifecycle.at_risk")),
      kv("Rule dates", o.meta.lifecycle_rules_unverified ? "UNVERIFIED" : "verified")),
    col("Data quality", kv("Errors", fig("quality.error")), kv("Warnings", fig("quality.warn")), kv("Informational", fig("quality.info")), kv("Parity outliers", fig("parity.outliers"))),
    col("Data richness", kv("Grade", fig("estate.data_grade")), kv("Basis", rich.label), kv("Peak coverage", Math.round(rich.peak_coverage * 100) + "%"), kv("Memory coverage", Math.round(rich.memory_coverage * 100) + "%")),
    col("Agent and review", kv("Proposals accepted / rejected / pending", `${kp.proposals.accepted} / ${kp.proposals.rejected} / ${kp.proposals.pending}`),
      kv("Analyst hours logged", kp.analyst_hours_logged == null ? "none" : kp.analyst_hours_logged), kv("Turnaround so far (hours)", kp.turnaround_hours),
      kv("Model calls / tokens", `${kp.llm_calls} / ${num(kp.tokens_in + kp.tokens_out)}`))));
  v.append(estimatePanel(o));
  v.append(el("p", { class: "src" }, rich.reasons.join("; ") + ". Click any underlined figure to see its receipt."));
}

// ------------------------------------------------------------------ workloads
async function workloads(v) {
  v.append(el("h2", {}, "Workloads"), el("p", { class: "lede" }, "One row per server. Open a row for the sizing basis, cost in each scenario, licensing treatment, lifecycle and source rows."));
  const awsSizing = S.ov.sizing_source === "aws_transform";
  if (awsSizing) v.append(el("div", { class: "notice teal" }, "Sizing and costs on this tab are AWS Transform's per-server results (instance from the recommended pricing model; annual cost = compute, license, network and storage; AWS's support charge is not allocated to servers). Click a row for every pricing model, the utilization AWS used, and its warnings."));
  else if (!S.ov.estimate_ran) v.append(el("div", { class: "notice amber" }, "Sizing and costs are hidden: AWS Transform's per-server results are not imported (import the analysis workbook, or use 'Fetch the results now') and A01's offline estimate has not been run. This tab shows the inventory and lifecycle findings only."), el("button", { class: "btn alt", onclick: runEstimate }, "Run A01's offline estimate"));
  if (S.ov.aws && S.ov.estimate_ran) v.append(el("div", { class: "notice amber" }, awsSizing ? "A01's own per-server estimate (placeholder prices) is also shown, as a cross-check: it is never the headline." : "Sizing and costs on this tab are A01's own per-server ESTIMATE (placeholder prices). The figures on the slides come from AWS Transform; its per-server results were not imported."));

          ...unread.map(n => el("p", { class: "src" }, "Not read: " + n))) : null);
    }
    else if (a) put(el("h3", {}, "Per-server results"), el("p", { class: "src" }, "Not imported: the analysis workbook (analysis_<timestamp>.xlsx, inside the assessment zip) was missing or unreadable. " + ((ps && ps.notes || []).join(" ") || "Use 'Fetch the results now' or import the zip.")));
    put(el("h3", {}, "What AWS Transform assumed"), ...Object.entries(a.assessments).map(([k, x]) => el("details", {},
      el("summary", {}, `${k}: ${x.resources || ""}` + (x.annual_cost != null ? `, ${money(x.annual_cost)} per year` : "")),
      el("ul", {}, ...(x.assumptions || []).map(q => el("li", {}, q))), (x.recommendations || []).length ? el("div", { class: "src" }, "Recommendations: " + x.recommendations.filter(Boolean).join("; ")) : null)));
    put(el("h3", {}, `Warnings from AWS Transform (${a.warning_rows} rows)`), t.warnings.length
      ? tbl(["Code", "Resources", "What it means", "What to do"], t.warnings.map(w => [w.code, w.detail.count, w.detail.impact, w.detail.recommendation]))
      : el("p", { class: "src" }, "none"), el("p", { class: "src" }, "These are also on the Exceptions tab and must be acknowledged before release."));
    put(el("h3", {}, "Files"), ...Object.entries(a.files).map(([k, n]) => el("div", {}, el("a", { href: `/download/${S.run}/transform/${encodeURIComponent(n)}` }, n), el("span", { class: "src" }, "  " + k))));
  }

  put(el("h3", {}, "Fetch the results from the job"),
    el("p", { class: "src" }, "A01 fetches the results by itself when the job finishes. If it is still waiting after AWS Transform says the reports are ready, fetch them now: no manual download. The Outputs tab lists every file the job produced."),
    el("div", { class: "row" }, el("button", { class: "btn good", onclick: () => needWho() && act(() => api(`/api/run/${S.run}/transform_fetch_results`, { by: who() }), "Results fetched: the other tabs are filled") }, "Fetch the results now and fill the other tabs")));
  const fileIn = el("input", { type: "file", multiple: true, accept: ".zip,.json,.csv,.xlsx", "aria-label": "AWS Transform assessment" });
  put(el("h3", {}, "Or import a finished assessment"), el("p", { class: "src" }, "Select aggregated_output.json (the totals) and, if you have them, error_file.csv and analysis_<timestamp>.xlsx (the per-server results; it is inside the assessment zip): you can pick several files at once. Imported figures replace A01's own estimate on the slides."),
    el("div", { class: "row" }, S.app.demo_samples ? el("button", { class: "btn alt", onclick: () => act(() => api(`/api/run/${S.run}/import_results`, { by: who() || "ui", sample: "aws_transform_assessment_rvtools" }), "Sample assessment imported") }, "DEMO: import the sample assessment (RVTools run)") : null,
      fileIn, el("button", { class: "btn alt", onclick: () => { if (!fileIn.files.length) return toast("Choose the file(s) first", true);
        const read = f => new Promise(res => { const r = new FileReader(); r.onload = () => res({ name: f.name, b64: r.result.split(",")[1] }); r.readAsDataURL(f); });
        Promise.all([...fileIn.files].map(read)).then(files => act(() => api(`/api/run/${S.run}/import_results`, { by: who() || "ui", files }), "AWS Transform assessment imported")); } }, "Import file(s)")));
}

// ------------------------------------------------------------------ outputs
const ART = { run: null, data: null, sel: new Set() };       // survives the page's automatic re-renders: the list and the ticks stay
function artifactPanel() {
  if (ART.run !== S.run) { ART.run = S.run; ART.data = null; ART.sel = new Set(); }
  const wrap = el("div", { class: "panel", style: "margin-top:18px" }), body = el("div"), sel = ART.sel;
  const size = n => n == null ? "" : (n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB");
  const go = r => { if (r.zip) window.location = `/download/${S.run}/transform/${encodeURIComponent(r.zip)}`; else if (r.files.length === 1) window.location = `/download/${S.run}/artifact/${r.files[0].id}`; };
  let last = null;
  const fetchIds = async (ids, all) => {
    toast("Fetching from AWS Transform\u2026");
    try { const r = await api(`/api/run/${S.run}/transform_artifacts_fetch`, { by: who() || "ui", ids, all }); go(r); await refreshList(); }
    catch (e) { toast(e.message, true); }
  };
  const draw = r => {
    last = ART.data = r; body.replaceChildren();
    if (!r.items.length) { body.append(el("div", { class: "notice amber" }, "AWS Transform did not list any file for this job."), el("p", { class: "src" }, "What each listing returned:"), el("pre", {}, (r.report || []).join("\n") || "(nothing)")); return; }
    const rows = r.items.map(i => {
      const cb = el("input", { type: "checkbox", "aria-label": "Select " + i.name }); cb.checked = sel.has(i.artifactId);
      cb.onchange = () => { if (cb.checked) sel.add(i.artifactId); else sel.delete(i.artifactId); };
      return [cb, i.name, i.folder || "(top)", size(i.size), i.downloaded ? "in A01" : "", el("button", { class: "btn alt", onclick: () => fetchIds([i.artifactId], false) }, "Download")];
    });
    body.append(tbl(["", "File", "Folder", "Size", "", ""], rows), el("div", { class: "row" },
      el("button", { class: "btn alt", onclick: () => { r.items.forEach(i => sel.add(i.artifactId)); draw(r); } }, "Select all"),
      el("button", { class: "btn alt", onclick: () => { sel.clear(); draw(r); } }, "Select none"),
      el("button", { class: "btn good", onclick: () => sel.size ? fetchIds([...sel], false) : toast("Tick at least one file", true) }, "Download selected"),
      el("button", { class: "btn good", onclick: () => fetchIds([], true) }, "Download all (one zip)")));
  };
  const refreshList = async () => {
    if (!last) body.replaceChildren(el("div", { class: "src" }, "Asking AWS Transform for the job's files\u2026"));
    try { draw(await api(`/api/run/${S.run}/transform_artifacts_list`, {})); } catch (e) { body.replaceChildren(el("div", { class: "notice red" }, e.message)); }
  };
  wrap.append(el("h3", { style: "margin-top:0" }, "AWS Transform artifacts"),
    el("p", { class: "src" }, "Everything AWS Transform produced for this run's job, read live from the job. Tick files and download them, or download everything as one zip. The results A01 needs to fill the other tabs are fetched automatically; if that is slow, fetch them now."),
    el("div", { class: "row" }, el("button", { class: "btn alt", onclick: refreshList }, "Refresh the list from AWS Transform"),
      el("button", { class: "btn good", onclick: () => needWho() && act(() => api(`/api/run/${S.run}/transform_fetch_results`, { by: who() }), "Results fetched: the other tabs are filled") }, "Fetch the results now and fill the other tabs")), body);
  if (ART.data) draw(ART.data);
  return wrap;
}

async function outputs(v) {
  const o = await api(`/api/run/${S.run}/outputs`);
  v.append(el("h2", {}, "Outputs"), el("p", { class: "lede" }, "The deck (PPTX and PDF), the supporting workbook that traces every slide figure, and the exceptions list. Until the run is finalised every file is stamped DRAFT."));
  const tpl = el("input", { placeholder: "Path to the approved Ingram template .pptx (optional)", style: "min-width:380px", "aria-label": "Template path" });
  const res = el("div");
  v.append(el("div", { class: "row" }, tpl, el("button", { class: "btn good", onclick: () => act(async () => {
    res.replaceChildren(el("div", { class: "src" }, "Building\u2026")); const r = await api(`/api/run/${S.run}/export`, { template: tpl.value, pdf: true });
    res.replaceChildren(el("div", { class: "notice " + (r.notes.length ? "amber" : "teal") }, "Export " + r.status + (r.notes.length ? ": " + r.notes.join("; ") : "")),
      ...Object.values(r.files).map(f => { const n = f.split("/").pop(); return el("div", {}, el("a", { href: `/download/${S.run}/${encodeURIComponent(n)}` }, n)); })); }) }, "Build deck and workbook")), res);
  v.append(el("h3", {}, "Files in this run"), ...(o.files.length ? o.files.map(n => el("div", {}, el("a", { href: `/download/${S.run}/${encodeURIComponent(n)}` }, n))) : [el("p", { class: "src" }, "None yet.")]));
  v.append(artifactPanel(), el("p", { class: "src", style: "margin-top:18px" }, "Running or importing an AWS Transform assessment is on the AWS Transform tab."));
}

// ------------------------------------------------------------------ audit
async function audit(v) {
  const a = await api(`/api/run/${S.run}/audit`);
  v.append(el("h2", {}, "Audit"), el("p", { class: "lede" }, "Every input, model call, tool call, decision and export, chained by hash so any edit or deletion is detectable."),
    el("div", { class: "notice " + (a.verify.ok ? "teal" : "red") }, a.verify.message + ` (${a.verify.entries} entries)`),
    el("div", { style: "overflow:auto" }, el("table", {}, el("thead", {}, el("tr", {}, ["#", "Time (UTC)", "Event", "Actor", "Data"].map(h => el("th", {}, h)))),
      el("tbody", {}, a.entries.slice().reverse().map(e => el("tr", {}, el("td", {}, e.n), el("td", {}, e.ts), el("td", {}, e.event), el("td", {}, e.actor), el("td", {}, JSON.stringify(e.data).slice(0, 160))))))));
}

// ------------------------------------------------------------------ new run
async function newRun() {
  const samples = S.app.demo_samples ? await api("/api/samples") : [], d = $("#dlg"), demo = samples.length > 0;
  const pick = (role, type) => samples.filter(s => s.role === role).map(s => el("label", { style: "display:block" }, el("input", { type, name: role, value: s.name }), " " + s.name, el("span", { class: "chip amber" }, "DEMO sample"), s.group === "real_format" ? el("span", { class: "chip teal" }, "real layout") : el("span", { class: "chip" }, "synthetic"), s.kind ? el("span", { class: "src" }, " " + s.kind) : null));
  const upl = el("input", { type: "file", multiple: true, accept: ".xlsx,.zip,.csv", "aria-label": "Estate files" }), lic = el("input", { type: "file", accept: ".xlsx,.json,.csv", "aria-label": "Licensing file" }), notes = el("input", { type: "file", multiple: true, accept: ".txt,.md", "aria-label": "Interview notes" });
  const label = el("input", { placeholder: "e.g. Customer A, September data" }), days = el("input", { type: "number", min: 1, placeholder: "e.g. 14" }), cust = el("input", { placeholder: "Anonymised customer label" });
  const read = f => new Promise(res => { const r = new FileReader(); r.onload = () => res({ name: f.name, b64: r.result.split(",")[1] }); r.readAsDataURL(f); });
  const field = (t, input, hint) => el("div", { class: "field" }, el("label", {}, t), input, hint ? el("div", { class: "src" }, hint) : null);
  d.replaceChildren(el("h4", {}, "New run"),
    el("p", { class: demo ? "notice amber" : "src" }, demo ? "DEMO MODE: bundled sample files are offered below. You can also upload your own." : "Upload your own files. Nothing is pre-loaded, and uploaded data stays on this machine."),
    el("h3", {}, "Estate export (required)"), ...pick("estate", "checkbox"),
    field(demo ? "or upload" : "Choose file(s)", upl, "Cloudamize: MPA export, OLA Accelerator export or Download All Reports (.xlsx). RVTools: the .xlsx export or a .zip of its CSV files."),
    el("h3", {}, "Licensing input (optional)"), ...(demo ? [el("label", { style: "display:block" }, el("input", { type: "radio", name: "licsample", value: "", checked: true }), " none")] : []),
    ...pick("licensing", "radio").map(x => { x.querySelector("input").name = "licsample"; return x; }),
    field(demo ? "or upload" : "Choose file (optional)", lic, "The licensing analyst's workbook (.xlsx) or an A02 findings file (.json)."),
    el("h3", {}, "Interview notes (optional)"), ...pick("notes", "checkbox"),
    field(demo ? "or upload .txt/.md" : "Choose file(s) (optional)", notes, "Plain text or markdown. Treated as data, never as instructions."),
    field("Label", label), field("Collection span in days, if known", days), field("Customer label on the deck", cust),
    el("div", { class: "row", style: "margin-top:12px" }, el("button", { class: "btn good", onclick: async ev => {
      const body = { samples: [...d.querySelectorAll("input[name=estate]:checked")].map(x => x.value), label: label.value, collection_days: +days.value || null, customer: cust.value };
      if (!upl.files.length && !body.samples.length) return toast("Choose the estate file(s) to upload first", true);
      if (upl.files.length) body.files = await Promise.all([...upl.files].map(read));
      const ls = d.querySelector("input[name=licsample]:checked"); if (ls && ls.value) body.licensing_sample = ls.value; if (lic.files[0]) body.licensing = await read(lic.files[0]);
      const ns = d.querySelector("input[name=notes]:checked"); if (ns) body.notes_sample = ns.value; if (notes.files.length) body.notes = await Promise.all([...notes.files].map(read));
      ev.target.disabled = true; ev.target.textContent = "Processing\u2026";
      try { const r = await api("/api/runs", body); d.close(); S.run = null; await loadRuns(false); await selectRun(r.run_id); toast("Run created"); } catch (e) { toast(e.message, true); ev.target.disabled = false; ev.target.textContent = "Create run"; } } }, "Create run"),
      el("button", { class: "btn alt", onclick: () => d.close() }, "Cancel")));
  d.showModal();
}
$("#newrun").addEventListener("click", newRun);
$("#who").value = localStorage.getItem("cva.who") || ""; $("#who").addEventListener("input", e => localStorage.setItem("cva.who", e.target.value));
(async () => {
  try { S.app = await api("/api/app"); } catch (e) { /* older server: no samples */ }
  if (S.app.signed_in) { $("#signout").hidden = false; $("#whoami").textContent = "Signed in as " + S.app.user; if (!$("#who").value.trim()) $("#who").value = S.app.user; }
  const h = location.hash.slice(1).split("/");
  if (h[0] && /^run-\d+$/.test(h[0])) { S.run = h[0]; S.view = h[1] || "overview"; await refresh(); }
  await loadRuns(false);          // never open an earlier run by itself: a fresh page shows nothing until a run is chosen or created
  render();
})();
</script>
</body>
</html>
